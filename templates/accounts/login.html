{% extends 'base.html' %}

{% block title %}Sign In | Aether University Portal{% endblock %}

{% block content %}
<section class="py-5">
    <div class="container">
        <div class="row justify-content-center align-items-center g-5">
            <!-- Login Form Card -->
            <div class="col-lg-5">
                <div class="glass-card p-4 p-md-5">
                    <div class="text-center mb-4">
                        <span class="badge-pill-glow mb-2 d-inline-block">
                            <i class="bi bi-shield-lock-fill me-1"></i> RBAC Protected Gateway
                        </span>
                        <h3 class="fw-bold text-white">Portal Authentication</h3>
                        <p class="text-secondary small">Sign in with your institutional username or email</p>
                    </div>

                    <form method="post" action="{% url 'login' %}">
                        {% csrf_token %}
                        <div class="mb-3">
                            <label class="form-label small text-secondary fw-semibold">Username or Institutional Email</label>
                            <div class="input-group">
                                <span class="input-group-text bg-dark border-secondary text-info">
                                    <i class="bi bi-person-fill"></i>
                                </span>
                                <input type="text" id="id_username" name="username" class="form-control bg-dark border-secondary text-white"
                                       placeholder="e.g. student or yassine.m@university.edu" required>
                            </div>
                        </div>

                        <div class="mb-4">
                            <label class="form-label small text-secondary fw-semibold">Password</label>
                            <div class="input-group">
                                <span class="input-group-text bg-dark border-secondary text-info">
                                    <i class="bi bi-key-fill"></i>
                                </span>
                                <input type="password" id="id_password" name="password" class="form-control bg-dark border-secondary text-white"
                                       placeholder="••••••••••••" required>
                            </div>
                        </div>

                        <button type="submit" class="btn btn-gradient-primary w-100 py-2">
                            <i class="bi bi-box-arrow-in-right me-2"></i>Sign In to Workspace
                        </button>
                    </form>

                    <!-- 1-Click Quick Fill for Academic Presentation -->
                    <div class="mt-4 pt-3 border-top border-secondary border-opacity-25">
                        <div class="small text-secondary mb-2 text-center">
                            <i class="bi bi-lightning-charge-fill text-warning me-1"></i>Quick-Fill Demo Role Credentials:
                        </div>
                        <div class="d-flex gap-2 justify-content-center">
                            <button type="button" class="btn btn-outline-info btn-sm"
                                    onclick="fillCreds('student', 'Portal2026!')">
                                🎓 Student
                            </button>
                            <button type="button" class="btn btn-outline-primary btn-sm"
                                    onclick="fillCreds('instructor', 'Portal2026!')">
                                👨‍🏫 Instructor
                            </button>
                            <button type="button" class="btn btn-outline-warning btn-sm"
                                    onclick="fillCreds('admin', 'Portal2026!')">
                                🛡️ Admin
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>

<script>
function fillCreds(user, pass) {
    document.getElementById('id_username').value = user;
    document.getElementById('id_password').value = pass;
}
</script>
{% endblock %}
